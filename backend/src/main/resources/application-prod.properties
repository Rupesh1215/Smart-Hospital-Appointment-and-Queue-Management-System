# ==========================================
# Smart Hospital — Production Configuration
# ==========================================
# Activated via: SPRING_PROFILES_ACTIVE=prod

# ========================
# Server Configuration
# ========================
server.port=8080
spring.application.name=smart-hospital

# ========================
# MongoDB Configuration
# ========================
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/smart_hospital}
spring.data.mongodb.auto-index-creation=true

# ========================
# JWT Configuration
# ========================
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=86400000
app.jwt.refresh-expiration-ms=604800000

# ========================
# Gemini AI Configuration
# ========================
app.gemini.api-key=${GEMINI_API_KEY:}
app.gemini.model=gemini-2.0-flash

# ========================
# CORS Configuration
# ========================
# Add your production domain(s) here
app.cors.allowed-origins=http://localhost:80,http://localhost:5173,http://localhost:3000

# ========================
# Logging (Production)
# ========================
logging.level.root=WARN
logging.level.com.hospital.smart=INFO
logging.level.org.springframework.data.mongodb=WARN
logging.level.org.springframework.security=WARN
logging.level.org.springframework.web=WARN

# ========================
# Jackson Configuration
# ========================
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null
