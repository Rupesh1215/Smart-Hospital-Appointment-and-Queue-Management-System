# ========================
# Server Configuration
# ========================
server.port=8080
spring.application.name=smart-hospital

# ========================
# MongoDB Configuration
# ========================
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/smart_hospital}
spring.data.mongodb.auto-index-creation=true

# ========================
# JWT Configuration
# ========================
app.jwt.secret=${JWT_SECRET:myDefaultDevSecretKeyThatIsAtLeast256BitsLongForHS256Algorithm}
app.jwt.expiration-ms=86400000
app.jwt.refresh-expiration-ms=604800000

# ========================
# Gemini AI Configuration
# ========================
app.gemini.api-key=${GEMINI_API_KEY:}
app.gemini.model=gemini-2.0-flash

# ========================
# CORS Configuration
# ========================
app.cors.allowed-origins=http://localhost:5173,http://localhost:3000

# ========================
# Logging
# ========================
logging.level.com.hospital.smart=DEBUG
logging.level.org.springframework.data.mongodb=DEBUG
logging.level.org.springframework.security=DEBUG

# ========================
# Jackson Configuration
# ========================
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null
